snapshots:
  - name: orders_snapshot
    relation: source('jaffle_shop', 'orders')
    config:
      schema: snapshots
      database: "{{ env_var('DBT_ENVIRONMENTS') }}_BRONZE_DB"
      unique_key: id
      strategy: check
      check_cols: ['status']
      # check_cols: ['id', 'user_id', 'order_date', 'status']
      hard_deletes: ignore
      dbt_valid_to_current: "to_date('9999-12-31')"