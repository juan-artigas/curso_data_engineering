version: 2

sources:
  - name: google_sheets # name of the source
    schema: google_sheets # this is the schema our raw data lives in
    database: "{{ env_var('DBT_ENVIRONMENTS') }}_BRONZE_DB" # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    freshness:
      warn_after: { count: 24, period: hour }
      error_after: { count: 48, period: hour }

    tables:
      - name: budget
        loaded_at_field: _fivetran_synced
        columns:
          - name: _row
            data_tests:
              - unique
              - not_null
          - name: product_id
            data_tests:
              - relationships:
                    to: source('sql_server_db','products')
                    field: product_id
          - name: quantity
            data_tests:
              - positive_values
          - name: month
          - name: _fivetran_synced
      - name: users
        loaded_at_field: fecha_alta_sistema
        columns:
          - name: Nombre
          - name: DNI
          - name: email
            data_tests:
              - check_mail:
                  config:
                    severity: error
                    error_if: ">1000"
                    warn_if: ">0"
          - name: fecha_alta_sistema
